# «Ритм» — сервер сообщества: /ritm/ → 127.0.0.1:8100 (B5), чат по WebSocket /ritm/teams/{id}/chat (B6).
    location ~ ^/ritm/teams/[0-9]+/chat$ { rewrite ^/ritm/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8100; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 3600s; proxy_send_timeout 3600s; }
    location /ritm/ { proxy_pass http://127.0.0.1:8100/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; client_max_body_size 512k; proxy_read_timeout 30s; }
